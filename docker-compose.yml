# Stem Separator — Base Docker Compose (CPU default)
#
# Start on CPU:
#   docker compose up -d --build
#
# Start with NVIDIA GPU acceleration (uses override file on the same service & port 7860):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

services:
  stem-separator:
    build:
      context: .
      dockerfile: Dockerfile
    image: paladini/stem-separator:latest
    container_name: stem-separator
    ports:
      - "7860:7860"
    volumes:
      - ./data/output:/data/output
      - stem-separator-models:/data/models
    environment:
      - PYTHONUNBUFFERED=1
      - AUDIO_SEPARATOR_MODEL_DIR=/data/models
      - STEM_SEPARATOR_OUTPUT_DIR=/data/output
      - STEM_SEPARATOR_MAX_UPLOAD_MB=250
      - STEM_SEPARATOR_MAX_DURATION_MINUTES=30
      - STEM_SEPARATOR_MIN_FREE_DISK_MB=500
      - STEM_SEPARATOR_MAX_CONCURRENT_JOBS=1
      - STEM_SEPARATOR_MAX_QUEUE_SIZE=5
      - STEM_SEPARATOR_JOB_RETENTION_HOURS=24
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  stem-separator-models:
